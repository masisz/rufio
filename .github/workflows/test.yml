name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-unix:
    name: Test (Ubuntu / Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  test-macos:
    name: Test (macOS / Ruby 3.3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Run tests
        run: bundle exec rake test

  # 同梱する Zig ライブラリ（検索エンジン）の単体テストを各 OS で実行
  test-zig:
    name: Zig engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      - name: Run Zig tests
        working-directory: lib_zig/rufio_native
        run: zig build test

  test-windows:
    name: Test (Windows / Ruby ${{ matrix.ruby }})
    runs-on: windows-latest
    strategy:
      matrix:
        ruby: ['3.2', '3.3']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # Windows Console で ESC キーが機能するかを含む全テストを実行
      - name: Run tests (Windows)
        run: bundle exec rake test
        env:
          # Windows Console を強制 (ConPTY 経由にならないようにする)
          TERM: xterm-256color

      # Windows 専用: ESC キー・マルチバイト入力・マウスシーケンス・IO.select タイムアウトの検証
      - name: Run Windows console input tests
        run: bundle exec ruby -I test -I lib test/test_windows_console_input.rb
